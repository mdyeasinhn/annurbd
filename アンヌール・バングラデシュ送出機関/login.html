    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .bg-mesh {
            background-color: #f8fafc;
            background-image:

<body class="bg-mesh min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-[440px]">

        <p class="text-slate-500 mt-2">Amazing Things Administrative Portal</p>
    </div>

    <div class="glass p-10 rounded-[32px] shadow-2xl">
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="text-sm font-semibold text-slate-700">Username</label>
                <input type="text" id="username" required

            </div>

            <div>
                <label class="text-sm font-semibold text-slate-700">Password</label>
                <input type="password" id="password" required
                    class="w-full mt-2 px-4 py-4 bg-slate-50 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl">
                Sign In
            </button>
        </form>
    </div>
</div>
